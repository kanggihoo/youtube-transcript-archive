                  - generic [ref=f4e1310]:
                    - text: 코딩 에이전트가 팀 생산성을 키우려면, 개인이 코드를 고치는 데서 멈추지 않고 에이전트가 일하는 시스템을 개선해야 합니다. Patrick Debois가 하니스, 피드백 루프, 플랫폼 팀, 그리고 조직의 지식 축적이 왜 핵심인지 설명합니다. 주요 포인트
                    - list [ref=f4e1311]:
                      - listitem [ref=f4e1312]: 에이전트 코딩의 차별점은 모델 자체보다 팀의 작업 방식에 있습니다.
                      - listitem [ref=f4e1313]: 결과 코드만 고치지 말고, 에이전트가 반복해서 막히는 시스템을 개선해야 합니다.
                      - listitem [ref=f4e1314]: 하니스와 컨텍스트를 공용 자산으로 만들면 한 번의 개선이 팀 전체에 퍼집니다.
                      - listitem [ref=f4e1315]: 플랫폼 팀은 가드레일·평가·비용 가시성을 갖춘 '포장된 길'을 제공해야 합니다.
                      - listitem [ref=f4e1316]: 경쟁력은 새로운 지식을 빠르게 반영하면서도 시스템을 안정적으로 유지하는 능력입니다.
